<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 8px;
    }

    body {
      width: 320px; 
      padding: 20px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      letter-spacing: -0.025em;
    }
    
    button {
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .pause-btn {
      width: 100%;
      margin-bottom: 8px;
      background-color: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .pause-btn:hover:not(:disabled) {
      background-color: #e2e8f0;
    }

    .pause-btn.active {
      background-color: #fef2f2;
      color: var(--danger);
      border-color: #fecaca;
    }
    
    .pause-status {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
      min-height: 18px;
    }
    
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    input[type="text"] {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    #addBtn {
      background-color: var(--primary);
      color: white;
      padding: 8px 16px;
    }

    #addBtn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .site-list {
      max-height: 260px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .site-list::-webkit-scrollbar {
      width: 6px;
    }
    .site-list::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }
    
    .site-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px; 
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .site-item:hover {
      border-color: #cbd5e1;
    }

    .site-name {
      font-weight: 500;
      word-break: break-all;
    }
    
    .remove-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 22px;
      line-height: 1;
      border-radius: 4px;
    }
    
    .remove-btn:hover:not(:disabled) {
      background-color: #fee2e2;
      color: var(--danger);
    }
    
    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 24px;
      font-style: italic;
    }
    
    /* Modal improvements */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 260px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      z-index: 1001;
      text-align: center;
    }
    
    .modal h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 600;
    }
    
    .modal p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    
    .timer-text {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }
    
    .modal input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      box-sizing: border-box;
      text-align: center;
      font-size: 14px;
    }

    .modal input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-buttons button {
      flex: 1;
    }

    #cancelBtn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    #cancelBtn:hover {
      background: #e2e8f0;
    }

    #confirmBtn {
      background: var(--primary);
      color: white;
    }

    #confirmBtn:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    
        .divider {
      height: 1px;
      background-color: var(--border);
      margin: 20px 0 16px 0;
    }

    .donate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px;
      background-color: transparent;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s ease;
      box-sizing: border-box;
      margin-top: 8px;
    }

    .donate-btn:hover {
      background-color: #fff7ed;
      color: #ea580c;
      border-color: #fdba74;
      border-style: solid;
      transform: translateY(-1px);
    }

    .donate-btn svg {
      margin-right: 8px;
      transition: transform 0.2s ease;
    }

    .donate-btn:hover svg {
      transform: scale(1.1);
      fill: #ffedd5;
    }
  </style>
</head>
<body>
  <h2>Blocksite</h2>
  
  <button class="pause-btn" id="pauseBtn">Pause blocking for 15 min</button>
  <div class="pause-status" id="pauseStatus"></div>

  <div class="input-group">
    <input type="text" id="siteInput" placeholder="example.com" autocomplete="off">
    <button id="addBtn">Add</button>
  </div>

  <div class="site-list" id="siteList"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Confirm action</h3>
      <p id="modalText">Wait 5 seconds...</p>
      <div class="timer-text" id="timerText">5</div>
      <input type="text" id="confirmInput" placeholder="Type to confirm" style="display: none;" autocomplete="off">
      <div class="modal-buttons">
        <button id="cancelBtn">Cancel</button>
        <button id="confirmBtn" disabled>Confirm</button>
      </div>
    </div>
  </div>

    <div class="divider"></div>
  <a href="https://boosty.to/hektr992" target="_blank" rel="noopener noreferrer" class="donate-btn" id="donateBtn">
    Support the developer
  </a>

  <script src="popup.js"></script>
</body>
</html>
